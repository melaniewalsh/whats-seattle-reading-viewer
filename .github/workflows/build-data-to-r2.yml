name: Build full database and upload to R2

# Builds the full library.sqlite3 from R2's monthly files (~18 min) and uploads
# the finished database back to R2, where the live site reads it directly over
# HTTP range requests (sql.js-httpvfs). The website deploy (deploy.yml) is
# separate and fast -- it never rebuilds this DB.
#
# TRIGGERS: monthly + manual ONLY (not on push). The monthly run is staggered a
# few hours after the R2 data pull (update.yml @ 06:00) so it reads fresh data.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 5 * *" # 5th, 12:00 UTC (after update.yml's 06:00 data pull)

permissions:
  contents: write # push the regenerated author_map.json back to the repo

env:
  # The PUBLIC R2 bucket the finished DB is uploaded to (see README for the
  # one-time Cloudflare setup: public access + CORS). Override here if you name
  # the bucket differently.
  R2_DB_BUCKET: spl-checkouts-public
  DB_OBJECT_KEY: library.sqlite3
  R2_ENDPOINT_URL: https://dd55a988a4598a3425259692fe6f7ba1.r2.cloudflarestorage.com

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # Reclaim ~30 GB so the build's disk (CSVs + Parquet + DuckDB spill) fits.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install duckdb boto3 orjson pyarrow python-dotenv rapidfuzz numpy

      # Regenerate data-prep/author_map.json from the CURRENT cluster_authors.py
      # so improvements to the clustering go live without anyone running it
      # locally. build_data.py (next step) reads this file via its CLUSTERING
      # HOOK. The map committed in the repo is just a fallback; this overwrites
      # it for the build.
      - name: Regenerate author clusters
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          # Don't let a clustering failure block the whole data rebuild -- fall
          # back to the author_map.json committed in the repo.
          python3 data-prep/cluster_authors.py \
            || echo "cluster_authors.py failed -- falling back to the committed author_map.json"
          if [ -f data-prep/author_map.json ]; then
            echo "author_map.json in place ($(wc -c < data-prep/author_map.json) bytes)"
          else
            echo "no author_map.json -- building without author merges"
          fi

      # Commit the freshly regenerated map back to main so it stays
      # version-controlled (and diffable) instead of only living inside this
      # run. cluster_authors.py also writes author_title_agg.json (a scan cache)
      # and processed_files.csv (a ledger) -- deliberately NOT committed here.
      - name: Commit regenerated author_map.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-prep/author_map.json
          if git diff --cached --quiet; then
            echo "author_map.json unchanged -- nothing to commit"
          else
            git commit -m "CI: regenerate author_map.json"
            # The full build runs ~1h, so other commits are likely to have
            # landed on the branch meanwhile -- rebase (retrying) before pushing.
            for i in 1 2 3; do
              git pull --rebase origin ${{ github.ref_name }} \
                && git push origin HEAD:${{ github.ref_name }} && break
              echo "push race, retry $i" && sleep 3
            done
          fi

      - name: Build per-author JSON files from R2
        env:
          # build_data.py reads R2_* names; repo secrets are named AWS_*.
          R2_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # ~7 GB runner RAM: cap DuckDB low so it spills to disk instead of OOM.
          DUCKDB_MEMORY_LIMIT: 3GB
        run: |
          # cluster_authors.py and build_data.py share data-prep/processed_files.csv
          # as their "already handled" ledger. The clustering step above read all
          # the monthly files and marked them processed, which would make the build
          # think there's nothing to sync. Reset the ledger so the build re-syncs
          # the raw data from R2 as usual.
          rm -f data-prep/processed_files.csv
          python3 data-prep/build_data.py
          echo "author files: $(find static/data/authors -type f | wc -l)"
          ls -lh static/data/meta.json static/data/search-index.json
          # Title reverse-lookup index for the "By title" tab. High threshold so
          # only well-borrowed titles are searchable -> the index stays small.
          TITLE_MIN_CHECKOUTS=500 python3 data-prep/build_title_index.py

      - name: Upload data files to the public R2 bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          # The search index is the one biggish file the browser downloads on
          # load. Store it gzipped with Content-Encoding so the browser gets it
          # transparently decompressed (a few MB instead of ~15 MB).
          gzip -9 -c static/data/search-index.json > /tmp/search-index.json.gz
          aws s3 cp /tmp/search-index.json.gz \
            "s3://${R2_DB_BUCKET}/search-index.json" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --content-type application/json \
            --content-encoding gzip \
            --only-show-errors

          # The title index, same gzipped treatment as the author index.
          gzip -9 -c static/data/title-index.json > /tmp/title-index.json.gz
          aws s3 cp /tmp/title-index.json.gz \
            "s3://${R2_DB_BUCKET}/title-index.json" \
            --endpoint-url "$R2_ENDPOINT_URL" \
            --content-type application/json \
            --content-encoding gzip \
            --only-show-errors

          # Everything else: meta.json + the ~350k tiny authors/*.json files.
          # `aws s3 sync` is painfully slow at this many small files (it timed out
          # the 60-min job). rclone is built for it: parallel listing (--fast-list)
          # and high concurrency. `sync` mirrors the build, dropping files for
          # authors that were merged/removed; we exclude the separately-uploaded
          # search index and keep the old library.sqlite3 warm fallback.
          curl -fsSL https://rclone.org/install.sh | sudo bash
          export RCLONE_CONFIG_R2_TYPE=s3
          export RCLONE_CONFIG_R2_PROVIDER=Cloudflare
          export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID"
          export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
          export RCLONE_CONFIG_R2_ENDPOINT="$R2_ENDPOINT_URL"
          rclone sync static/data/ "R2:${R2_DB_BUCKET}/" \
            --transfers 128 --checkers 128 --fast-list --s3-no-check-bucket \
            --exclude "search-index.json" \
            --exclude "title-index.json" \
            --exclude "library.sqlite3" \
            --stats 30s --stats-one-line
          echo "Uploaded meta.json + search-index.json + author files to r2://${R2_DB_BUCKET}/"

      # Bundle the whole derived dataset into one tarball and publish it as a
      # dated GitHub Release -- a stable, citable, single-file snapshot for anyone
      # who wants the full corpus without fetching ~350k files from R2 one by one.
      # Tagged by the freshest data month (e.g. data-2026-06); re-runs update the
      # same release's asset. Supplementary to the live R2 copy, so a hiccup here
      # doesn't fail the build.
      - name: Publish monthly dataset snapshot (GitHub Release)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MONTH=$(python3 -c "import json; print(json.load(open('static/data/meta.json'))['months'][-1])")
          TAG="data-${MONTH}"
          TARBALL="whats-seattle-reading-data-${MONTH}.tar.gz"
          # Raw per-author JSON + indexes + month axis (drop the legacy sqlite blob).
          tar czf "$TARBALL" -C static --exclude='data/library.sqlite3' data
          echo "Built $TARBALL ($(du -h "$TARBALL" | cut -f1))"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --latest \
            --title "Data snapshot ${MONTH}" \
            --notes "Clustered Seattle Public Library checkout data through ${MONTH}: per-author JSON time series, the author and title search indexes, and the shared month axis. These are the same files served live from the R2 bucket, bundled for bulk download. See the repository README for the file layout and a fetch example."
          gh release upload "$TAG" "$TARBALL" --clobber
