name: Build full database and deploy

# Builds the FULL library.sqlite3 from R2 (~18 min) and deploys the site +
# database to GitHub Pages. The 727 MB DB is under the Pages 1 GB limit, so it
# ships in the Pages artifact and sql.js-httpvfs range-requests it same-origin.
#
# TRIGGERS: monthly + manual ONLY -- deliberately NOT on push, so a code change
# never kicks off the heavy 18-minute rebuild. To publish on demand, use the
# "Run workflow" button in the Actions tab.
#
# NOTE: the 727 MB DB can't be committed to git (100 MB file limit), so this is
# the only path that puts it on the live site. Pushing code alone won't
# redeploy it. If fast per-push site deploys become important, we can add a
# separate lightweight workflow that reuses the DB from the Actions cache.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 5 * *" # 06:00 UTC on the 5th of each month

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # never cancel a long data build partway through

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The full build needs ~45 GB working disk (12 GB CSVs + Parquet + DuckDB
      # spill). A stock runner only has ~33 GB free, so reclaim ~30 GB more.
      # (build_data.py also deletes each CSV right after caching it to Parquet.)
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: npm ci
      - run: pip install duckdb boto3 orjson pyarrow

      - name: Build library.sqlite3 from R2
        env:
          # build_data.py reads R2_* names; repo secrets are named AWS_*.
          R2_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # ~7 GB runner RAM: cap DuckDB low so it spills to (freed) disk
          # instead of OOMing.
          DUCKDB_MEMORY_LIMIT: 3GB
        run: |
          python3 data-prep/build_data.py
          ls -lh static/data/library.sqlite3

      - name: Build site (bundles static/data/library.sqlite3)
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
