name: Full-data build test

# Builds the FULL library.sqlite3 from the R2 bucket and reports its size and
# row counts -- but does NOT deploy, so it can't affect the live site. This is
# the "measure first" run: we need the DB size (Pages caps a site at ~1 GB) and
# the build's disk/time footprint before wiring it into the real deploy.
#
# Runs once when this file is pushed (the paths filter keeps it from re-running
# on every unrelated push), and can be re-run manually once it's on the default
# branch.

on:
  push:
    branches: [data_loading_improvements]
    paths:
      - ".github/workflows/full-data-test.yml"
      - "data-prep/build_data.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-db:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      # On this runner /mnt is the SAME disk as / (72 GB total, ~33 GB free
      # after basic cleanup) -- not a separate volume. The full build needs more
      # than that (12 GB CSVs + Parquet + up to 40 GB DuckDB spill), so free as
      # much as possible. This action reclaims ~30 GB (dotnet, android, haskell,
      # docker images, tool cache). build_data.py also now deletes each CSV right
      # after caching it to Parquet, which frees the ~12 GB of raw files before
      # the spill-heavy aggregation runs.
      - name: Free up disk space (aggressive)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - run: echo "=== free disk after cleanup ===" && df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install duckdb boto3 orjson pyarrow

      - name: Build full library.sqlite3 from R2
        env:
          # build_data.py reads R2_* names; repo secrets are named AWS_*.
          R2_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # NOTE: not setting R2_ENDPOINT_URL -- the AWS_S3_ENDPOINT secret is a
          # bare host (for the R aws.s3 package), which boto3 rejects. build_data.py
          # already defaults to the correct full https:// R2 endpoint.
        run: python3 data-prep/build_data.py

      - name: Report DB size, row counts, disk
        run: |
          echo "=== library.sqlite3 file ==="
          ls -lh static/data/library.sqlite3
          echo "=== contents ==="
          python3 - <<'PY'
          import sqlite3, json, os
          p = "static/data/library.sqlite3"
          print(f"file size: {os.path.getsize(p)/1e6:.1f} MB")
          db = sqlite3.connect(p)
          print("authors:", db.execute("SELECT count(*) FROM authors").fetchone()[0])
          print("titles :", db.execute("SELECT count(*) FROM titles").fetchone()[0])
          m = json.loads(db.execute("SELECT value FROM meta WHERE key='months'").fetchone()[0])
          print(f"months : {len(m)}  ({m[0]} … {m[-1]})")
          PY
          echo "=== disk after build ===" && df -h /

      # Upload the DB so you can download + inspect it. continue-on-error so a
      # too-big-to-upload DB still leaves the size numbers above in the log.
      - name: Upload library.sqlite3 as an artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: library-sqlite3
          path: static/data/library.sqlite3
          retention-days: 7
