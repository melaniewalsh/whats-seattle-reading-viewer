name: Monthly SPL Data Pull
 
on:
  schedule:
    # Runs at 06:00 UTC on the 5th of every month.
    # (Adjust the hour if you want this to land at a specific local time.)
    - cron: "0 6 5 * *"
  workflow_dispatch:  # lets you trigger it manually from the Actions tab too
 
jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # generous ceiling in case of a slow month/large pull
 
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
 
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"
 
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ hashFiles('**/Month_Loop_SPL.R') }}
          restore-keys: r-pkgs-
 
      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("httr", "jsonlite", "purrr", "aws.s3"), repos = "https://cloud.r-project.org")'
 
      - name: Run data pull script
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          Rscript "Data Pull/Month_Loop_SPL.R"
