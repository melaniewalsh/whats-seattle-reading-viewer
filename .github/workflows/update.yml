name: Monthly SPL Data Pull

on:
  schedule:
    - cron: "0 6 5 * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"

      - name: Set library path
        run: mkdir -p ~/.local/share/R/library

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ~/.local/share/R/library
          key: r-pkgs-${{ runner.os }}-${{ hashFiles('**/Month_Loop_SPL.R') }}

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("httr","jsonlite","purrr","aws.s3"),
            repos="https://cloud.r-project.org",
            lib="~/.local/share/R/library")'

      - name: Run script
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          Rscript -e '.libPaths("~/.local/share/R/library")'
          Rscript "Data Pull/Month_Loop_SPL.R"
